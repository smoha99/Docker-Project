<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CounterFlow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3ead9;
      color: #4a3f35;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #fbf6ea;
      border: 1px solid #e3d8c1;
      border-radius: 20px;
      padding: 60px 40px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #8a7c66;
      font-size: 18px;
      margin: 0;
    }
    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 45px;
    }
    .links a {
      color: #a9784f;
      font-weight: 600;
      text-decoration: none;
      font-size: 16px;
    }
    .links a:hover {
      color: #8a5e38;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to CounterFlow</h1>
    <p class="subtitle">A Flask + Redis visit counter, containerized with Docker.</p>
    <div class="links">
      <a href="https://github.com/smoha99/Docker-Project" target="_blank">GitHub</a>
      <a href="/about">About Me</a>
    </div>
  </div>
</body>
</html>
